<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PA-OS v3 - ポートフォリオエンジン</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <div class="branding">
    <div class="crest" aria-hidden="true">ポートフォリオOS</div>
    <div>
      <h1>ポートフォリオOS</h1>
      <div class="sub">ポートフォリオAI運用センター</div>
    </div>
  </div>
  <button id="startBtn" class="start-btn">🚀 ポートフォリオAI 起動</button>
</header>

<main class="container">

  <!-- ギルドマスター -->
  <section class="card master-card" data-anim>
    <div class="card-header"><h2>👑 ギルドマスター</h2><small>マスターの指令</small></div>
    <div class="card-body">
      <div id="masterName" class="master-name">マスター: —</div>
      <div id="masterMeta" class="master-meta">レベル: — ・ 指揮力: —</div>
    </div>
  </section>

  <!-- ギルド -->
  <section class="card guild-card" data-anim>
    <div class="card-header"><h2>🏰 ギルド</h2><small>同盟概要</small></div>
    <div class="card-body">
      <div id="guildName" class="guild-name">—</div>
      <div id="guildRank" class="rank">—</div>
    </div>
  </section>

  <!-- ダッシュボード -->
  <section class="dashboard-grid">
    <article class="card" data-anim>
      <div class="card-header"><h2>💰 総資産</h2><small>保有資産の合計</small></div>
      <div class="card-body">
        <div id="totalAssets" class="big-value">¥0</div>
        <div id="assetsTrend" class="trend up">—</div>
      </div>
    </article>

    <article class="card" data-anim>
      <div class="card-header"><h2>📈 本日の損益</h2><small>評価損益合計</small></div>
      <div class="card-body">
        <div id="dailyPnl" class="big-value profit">¥0</div>
        <div id="dailyNote" class="small">—</div>
      </div>
    </article>

    <article class="card" data-anim>
      <div class="card-header"><h2>⚔ パーティー評価</h2><small>構成の強さ</small></div>
      <div class="card-body">
        <div id="partyRank" class="rank-big">—</div>
        <div id="partyNote" class="small">—</div>
      </div>
    </article>

    <article class="card" data-anim>
      <div class="card-header"><h2>💸 配当収入</h2><small>月次推定</small></div>
      <div class="card-body">
        <div id="dividendIncome" class="big-value">¥0</div>
        <div id="dividendNote" class="small">—</div>
      </div>
    </article>

    <article class="card" data-anim>
      <div class="card-header"><h2>⚖️ リスク評価</h2><small>ポートフォリオのボラティリティ</small></div>
      <div class="card-body">
        <div class="radial">
          <svg viewBox="0 0 42 42"><circle r="15.9" cx="21" cy="21" class="bg"/><circle id="riskMeter" r="15.9" cx="21" cy="21" class="meter"/></svg>
          <div id="riskLabel" class="radial-label">0%</div>
        </div>
        <div id="riskNote" class="small">—</div>
      </div>
    </article>

    <article class="card" data-anim>
      <div class="card-header"><h2>📜 今日のミッション</h2><small>AI提案</small></div>
      <div class="card-body">
        <ul id="missionList" class="mission-list">
          <!-- ミッションはportfolio.jsonから生成されます -->
        </ul>
      </div>
    </article>
  </section>

  <!-- ギルドメンバー -->
  <section class="members-section">
    <div class="section-header"><h2>👥 ギルドメンバー</h2><small>冒険者と資産</small></div>
    <div id="membersGrid" class="members-grid">
      <!-- メンバーカードはportfolio.jsonから生成されます -->
    </div>
  </section>

  <!-- ボスカード -->
  <section class="card boss-card" data-anim>
    <div class="card-header"><h2>👑 今日のボス</h2><small>最大リスクと対処</small></div>
    <div class="card-body">
      <div id="bossRisk" class="boss-weakness">—</div>
      <div id="bossWeakness" class="boss-weakness">—</div>
      <div id="bossStrategy" class="ai-recommend">—</div>
    </div>
  </section>

</main>

<!-- 浮動起動ボタン -->
<button id="floatingStart" class="floating-start">ポートフォリオAI 起動</button>

<!-- 下部ナビ (日本語) -->
<nav class="bottom-nav" role="navigation" aria-label="メイン">
  <button class="nav-item active" data-nav="ホーム">🏠<span>ホーム</span></button>
  <button class="nav-item" data-nav="ギルド">🏰<span>ギルド</span></button>
  <button class="nav-item" data-nav="資産">💼<span>資産</span></button>
  <button class="nav-item" data-nav="市場">📈<span>市場</span></button>
  <button class="nav-item" data-nav="ポートフォリオAI">🤖<span>ポートフォリオAI</span></button>
</nav>

<footer class="footer">ポートフォリオOS v3</footer>

<script src="./script.js" defer></script>
</body>
</html>
