
<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>PA-OS | Portfolio AI</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background:#0b1220; color:#edf2f7; }
    .pa-wrap { max-width:850px; margin:auto; padding:16px; }
    .pa-panel { background:#131e30; border:1px solid #34445c; border-radius:14px; padding:16px; margin:14px 0; }
    .pa-panel h2 { color:#d4af37; margin-top:0; }
    .pa-form { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .pa-form label { display:block; font-size:13px; margin-bottom:5px; color:#cbd5e1; }
    .pa-form input,.pa-form select { box-sizing:border-box; width:100%; min-width:0; padding:11px; border-radius:8px; border:1px solid #46566e; background:#0b1220; color:white; font-size:16px; }
    .pa-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .pa-btn { border:1px solid #d4af37; border-radius:9px; padding:11px 14px; background:#d4af37; color:#101827; font-weight:bold; cursor:pointer; }
    .pa-btn.secondary { background:#202d42; color:#edf2f7; border-color:#52627a; }
    .pa-summary { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .pa-stat { background:#0b1220; border-radius:9px; padding:12px; overflow-wrap:anywhere; }
    .pa-stat small { display:block; color:#a8b5c7; margin-bottom:6px; }
    .pa-stat strong { font-size:19px; }
    .holding { background:#0b1220; border:1px solid #34445c; border-radius:12px; padding:14px; margin:12px 0; overflow-wrap:anywhere; }
    .holding-header { display:flex; justify-content:space-between; gap:12px; }
    .holding-name { font-size:18px; font-weight:bold; }
    .holding-code { color:#a8b5c7; font-size:13px; }
    .holding-info { line-height:1.9; margin-top:12px; overflow-wrap:anywhere; }
    .analysis-score { color:#f5d76e; text-align:right; font-weight:bold; }
    .positive { color:#55d6a0; } .negative { color:#ff8585; }
    .pa-note { color:#a8b5c7; font-size:12px; line-height:1.7; }
    @media(max-width:480px) { .pa-form { grid-template-columns:1fr; } .pa-wrap { padding:10px; } }
  </style>
  <script src="script.js?v=6" defer></script>
</head>
<body>
  <main class="pa-wrap">
    <header class="pa-panel">
      <h1 style="color:#d4af37">PA-OS</h1>
      <p>PORTFOLIO AI OPERATING SYSTEM</p>
      <p class="pa-note">あなたの資産を分析するポートフォリオ管理システム</p>
    </header>

    <section class="pa-panel">
      <h2>ポートフォリオ全体</h2>
      <div class="pa-summary">
        <div class="pa-stat"><small>登録資産数</small><strong id="total-holdings">0</strong></div>
        <div class="pa-stat"><small>投資元本</small><strong id="total-cost">0円</strong></div>
        <div class="pa-stat"><small>現在評価額</small><strong id="portfolio-value">未計算</strong></div>
        <div class="pa-stat"><small>含み損益</small><strong id="open-pl">未計算</strong></div>
        <div class="pa-stat"><small>損益率</small><strong id="portfolio-return">未計算</strong></div>
        <div class="pa-stat"><small>データ状況</small><strong id="data-status">入力待ち</strong></div>
      </div>
    </section>

    <section class="pa-panel">
      <h2>資産を登録・編集</h2>
      <form id="holding-form">
        <div class="pa-form">
          <div>
            <label for="stock-type">資産種別</label>
            <select id="stock-type">
              <option value="stock">個別株</option>
              <option value="etf">ETF</option>
              <option value="fund">投資信託</option>
            </select>
          </div>
          <div>
            <label for="stock-name">銘柄名 *</label>
            <input id="stock-name" required placeholder="例：日本精工">
          </div>
          <div>
            <label for="stock-code">銘柄コード・識別名</label>
            <input id="stock-code" placeholder="例：6471">
          </div>
          <div>
            <label for="stock-shares">保有株数・口数</label>
            <input id="stock-shares" type="number" min="0" step="any" placeholder="例：100">
          </div>
          <div>
            <label for="stock-cost">取得単価・平均取得基準価額（円）</label>
            <input id="stock-cost" type="number" min="0" step="any" placeholder="例：1000">
          </div>
          <div>
            <label for="stock-current">現在株価・基準価額（円）</label>
            <input id="stock-current" type="number" min="0" step="any" placeholder="例：1200">
          </div>
          <div>
            <label for="stock-dividend">配当利回り（%）</label>
            <input id="stock-dividend" type="number" min="0" step="any" placeholder="例：3.5">
          </div>
          <div>
            <label for="stock-per">PER（倍）</label>
            <input id="stock-per" type="number" min="0" step="any" placeholder="例：15">
          </div>
          <div>
            <label for="stock-pbr">PBR（倍）</label>
            <input id="stock-pbr" type="number" min="0" step="any" placeholder="例：1.2">
          </div>
          <div>
            <label for="stock-equity">自己資本比率（%）</label>
            <input id="stock-equity" type="number" min="0" max="100" step="any" placeholder="例：50">
          </div>
          <div>
            <label for="stock-growth">売上成長率（%）</label>
            <input id="stock-growth" type="number" step="any" placeholder="例：10">
          </div>
          <div>
            <label for="stock-stability">業績安定度（0〜100）</label>
            <input id="stock-stability" type="number" min="0" max="100" step="any" placeholder="分析用の任意入力">
          </div>
          <div>
            <label for="stock-risk">リスク水準（0〜100）</label>
            <input id="stock-risk" type="number" min="0" max="100" step="any" placeholder="高いほど危険">
          </div>
        </div>
        <div class="pa-actions">
          <button id="add-stock-btn" class="pa-btn" type="submit">＋ 台帳に登録</button>
          <button id="clear-form-btn" class="pa-btn secondary" type="button">入力クリア</button>
        </div>
        <p id="save-status" aria-live="polite">入力待ち</p>
      </form>
    </section>

    <section class="pa-panel">
      <h2>保有資産台帳</h2>
      <div class="pa-actions">
        <button id="reload-btn" class="pa-btn secondary" type="button">台帳を再読み込み</button>
        <button id="ai-analysis-btn" class="pa-btn" type="button">PA-OS分析</button>
        <button id="delete-all-btn" class="pa-btn secondary" type="button">全削除</button>
      </div>
      <div id="holdings-list"></div>
    </section>

    <section class="pa-panel">
      <h2>分析レポート</h2>
      <p id="test-status" aria-live="polite">起動確認中</p>
      <div id="ai-analysis-result">
        登録した資産の分析結果がここに表示されます。
      </div>
      <p class="pa-note">
        評価は入力データに基づく暫定的なルール評価です。
        未入力データは推測しません。投資成果を保証するものではありません。
        最新株価・ニュースは自動取得していません。
      </p>
    </section>
  </main>
</body>
</html>
