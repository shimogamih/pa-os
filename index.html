<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PA-OS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080c14;
      color: #f4f4f4;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      color: #d4af37;
      margin-bottom: 4px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      color: #8f9aad;
      margin-top: 0;
    }

    .card {
      background: #111824;
      border: 1px solid #283247;
      border-radius: 16px;
      padding: 18px;
      margin-top: 16px;
    }

    .gold {
      color: #d4af37;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      color: #aeb7c7;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #354158;
      background: #080d16;
      color: white;
      font-size: 16px;
    }

    button {
      border: 1px solid #d4af37;
      background: #171d2a;
      color: white;
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 16px;
      cursor: pointer;
    }

    button.primary {
      background: #4a3810;
    }

    button.danger {
      border-color: #7c3f46;
      color: #ff9ca7;
      padding: 8px 12px;
      font-size: 13px;
    }

    .button-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .holding {
      background: #0b111c;
      border: 1px solid #293449;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }

    .holding-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .holding-name {
      font-weight: bold;
      font-size: 17px;
    }

    .holding-code {
      color: #d4af37;
      font-size: 13px;
    }

    .holding-info {
      color: #aeb7c7;
      margin-top: 8px;
      line-height: 1.7;
    }

    .empty {
      color: #7e899b;
      text-align: center;
      padding: 20px 5px;
    }

    .success {
      color: #76d99a;
    }

    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .summary-item {
      background: #0b111c;
      border-radius: 10px;
      padding: 14px;
    }

    .summary-label {
      color: #8994a7;
      font-size: 12px;
    }

    .summary-value {
      margin-top: 5px;
      font-size: 20px;
      font-weight: bold;
    }

    .score {
      font-size: 30px;
      font-weight: bold;
      color: #d4af37;
      margin-top: 10px;
    }

    .score-good {
      color: #76d99a;
    }

    .score-watch {
      color: #f0c674;
    }

    .score-bad {
      color: #ff7b7b;
    }

    .metric {
      margin-top: 12px;
    }

    .metric-header {
      display: flex;
      justify-content: space-between;
      color: #aeb7c7;
      font-size: 14px;
    }

    .bar {
      height: 8px;
      background: #222c3c;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 5px;
    }

    .bar-inner {
      height: 100%;
      background: #d4af37;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>PA-OS</h1>

  <p class="subtitle">
    Portfolio AI Operating System
  </p>


  <!-- 銘柄入力 -->

  <div class="card">

    <h2>
      <span class="gold">Portfolio Ledger</span>
    </h2>

    <p class="subtitle">
      保有銘柄を登録します。
    </p>

    <label for="stock-name">銘柄名</label>

    <input
      id="stock-name"
      type="text"
      placeholder="例：四国電力"
    >

    <label for="stock-code">銘柄コード</label>

    <input
      id="stock-code"
      type="text"
      inputmode="numeric"
      placeholder="例：9507"
    >

    <label for="stock-shares">保有株数</label>

    <input
      id="stock-shares"
      type="number"
      inputmode="numeric"
      min="1"
      placeholder="例：100"
    >

    <label for="stock-cost">取得単価</label>

    <input
      id="stock-cost"
      type="number"
      inputmode="decimal"
      min="0"
      step="0.01"
      placeholder="例：1200"
    >

    <div class="button-row">

      <button
        id="add-stock-btn"
        class="primary"
        type="button"
      >
        ＋ 銘柄を追加
      </button>

      <button
        id="clear-form-btn"
        type="button"
      >
        入力をクリア
      </button>

    </div>

    <div id="save-status"></div>

  </div>


  <!-- サマリー -->

  <div class="card">

    <h2>現在のポートフォリオ</h2>

    <div class="summary">

      <div class="summary-item">

        <div class="summary-label">
          銘柄数
        </div>

        <div
          id="total-holdings"
          class="summary-value"
        >
          0
        </div>

      </div>

      <div class="summary-item">

        <div class="summary-label">
          投資元本
        </div>

        <div
          id="total-cost"
          class="summary-value"
        >
          ¥0
        </div>

      </div>

    </div>

  </div>


  <!-- 保有銘柄 -->

  <div class="card">

    <h2>保有銘柄</h2>

    <div id="holdings-list">

      <div class="empty">
        まだ銘柄が登録されていません。
      </div>

    </div>

  </div>


  <!-- テスト -->

  <div class="card">

    <h2>PA-OSテスト</h2>

    <div class="button-row">

      <button
        id="reload-btn"
        type="button"
      >
        台帳を再読み込み
      </button>

      <button
        id="delete-all-btn"
        class="danger"
        type="button"
      >
        全銘柄を削除
      </button>

    </div>

    <p id="test-status"></p>

  </div>


  <!-- AI分析 -->

  <div class="card">

    <h2>
      <span class="gold">AIポートフォリオ分析</span>
    </h2>

    <p class="subtitle">
      PA-OS独自100点評価エンジン
    </p>

    <button
      id="ai-analysis-btn"
      class="primary"
      type="button"
    >
      🤖 PA-OSで分析する
    </button>

    <div id="ai-analysis-result"></div>

  </div>

</div>


<script src="script.js?v=4"></script>

</body>
</html>
