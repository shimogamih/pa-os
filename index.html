<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PA-OS</title>

<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
 font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
 background:#111827;
 color:white;
}

header{
 background:#1f2937;
 padding:20px;
 text-align:center;
 font-size:32px;
 font-weight:bold;
 box-shadow:0 3px 10px rgba(0,0,0,.4);
}

.subtitle{
 color:#9ca3af;
 font-size:14px;
 margin-top:6px;
}

.container{
 padding:18px;
}

.card{
 background:#1f2937;
 border-radius:18px;
 padding:18px;
 margin-bottom:18px;
 box-shadow:0 6px 20px rgba(0,0,0,.35);
}

.title{
 font-size:22px;
 margin-bottom:12px;
}

.value{
 font-size:34px;
 font-weight:bold;
 color:#4ade80;
}

.guild{
 font-size:28px;
 text-align:center;
 margin:12px 0;
}

.rank{
 text-align:center;
 font-size:18px;
 color:#facc15;
}

.button{
 display:block;
 width:100%;
 padding:16px;
 margin-top:15px;
 font-size:18px;
 background:#2563eb;
 color:white;
 border:none;
 border-radius:12px;
}

.button:active{
 background:#1d4ed8;
}

.footer{
 text-align:center;
 padding:25px;
 color:#888;
 font-size:13px;
}

.list{
 display:flex;
 gap:12px;
 flex-wrap:wrap;
}
.member{
 background:#111827;
 padding:12px 14px;
 border-radius:12px;
 box-shadow:inset 0 -2px 0 rgba(0,0,0,0.3);
}
.member .name{font-weight:600}
.member .meta{color:#9ca3af;font-size:13px;margin-top:6px}

.boss{
 text-align:center;
 font-size:20px;
 font-weight:700;
 color:#f87171;
}

.small{
 color:#9ca3af;
 font-size:13px;
 margin-top:8px;
}

</style>

</head>

<body>

<header>

PA-OS

<div class="subtitle">
Portfolio AI Operating System
</div>

</header>

<div class="container">

<div class="card">

<div class="title">
🏰 ギルド
</div>

<div class="guild">
Blue Phoenix
</div>

<div class="rank">
★★★★★
</div>

</div>

<div class="card">

<div class="title">
💰 総資産
</div>

<div class="value">
¥0
</div>

<div class="small">現金・保有資産の合計</div>

</div>

<div class="card">

<div class="title">
⚔ パーティー評価
</div>

<div style="font-size:24px">
Sランク
</div>

<div style="margin-top:10px;color:#9ca3af">
バランスの良いポートフォリオです
</div>

</div>

<div class="card">

<div class="title">
📜 今日の作戦
</div>

<div style="line-height:1.8">

・押し目候補を監視<br>
・配当銘柄を強化<br>
・AI分析を実行

</div>

</div>

<div class="card">

<div class="title">
👥 ギルドメンバー
</div>

<div class="list">
 <div class="member">
   <div class="name">Aria</div>
   <div class="meta">資本: ¥1,200,000</div>
 </div>
 <div class="member">
   <div class="name">Borin</div>
   <div class="meta">資本: ¥740,000</div>
 </div>
 <div class="member">
   <div class="name">Cyn</div>
   <div class="meta">資本: ¥420,000</div>
 </div>
</div>

</div>

<div class="card">

<div class="title">
👑 ボス
</div>

<div class="boss">Overlord Kest</div>
<div class="small">ギルド全体の統括。戦略の最終承認者。</div>

</div>

<button class="button"
onclick="alert('Portfolio AI 起動予定')">

🚀 Portfolio AI 起動

</button>

</div>

<div class="footer">

PA-OS v0.1

</div>

</body>
</html>
